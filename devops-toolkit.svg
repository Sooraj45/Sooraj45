<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title"><title id="title">Toolkit: Linux, Docker, AWS, Python and GitHub.</title><defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040b13"/><stop offset=".55" stop-color="#07151b"/><stop offset="1" stop-color="#050812"/></linearGradient>
  <linearGradient id="neon"><stop stop-color="#47ff9d"/><stop offset=".52" stop-color="#00e5ff"/><stop offset="1" stop-color="#9974ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#00efbc" stop-opacity=".18"/><stop offset="1" stop-color="#00efbc" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0e333a" stroke-width=".6"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#091b23" stroke-width="1" opacity=".4"/></pattern>
</defs>
<style>
 text{font-family:Consolas,'Liberation Mono',monospace}
 .orbit{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
 .reverse{animation-direction:reverse;animation-duration:32s}
 .pulse{animation:pulse 3s ease-in-out infinite}
 .blink{animation:blink 1.2s steps(1) infinite}
 .flow{stroke-dasharray:8 20;animation:flow 2.5s linear infinite}
 .scan{animation:scan 8s linear infinite}
 .rain{animation:rain 9s linear infinite}
 .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3s ease-in-out infinite alternate}
 .glitch{animation:glitch 9s steps(1) infinite}
 .reveal{animation:reveal 8s steps(1) infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes blink{50%{opacity:0}}
 @keyframes flow{to{stroke-dashoffset:-112}}
 @keyframes scan{0%{transform:translateY(-160px);opacity:0}15%,85%{opacity:.45}100%{transform:translateY(420px);opacity:0}}
 @keyframes rain{from{transform:translateY(-150px)}to{transform:translateY(530px)}}
 @keyframes bar{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
 @keyframes glitch{0%,92%,96%,100%{opacity:0;transform:translateX(0)}93%{opacity:.8;transform:translateX(3px)}95%{opacity:.6;transform:translateX(-3px)}}
 @keyframes reveal{0%,24%{opacity:1}25%,100%{opacity:.2}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch{opacity:0}.scan{opacity:0}}
