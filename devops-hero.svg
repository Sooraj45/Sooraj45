 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes blink{50%{opacity:0}}
 @keyframes flow{to{stroke-dashoffset:-112}}
 @keyframes scan{0%{transform:translateY(-160px);opacity:0}15%,85%{opacity:.45}100%{transform:translateY(420px);opacity:0}}
 @keyframes rain{from{transform:translateY(-150px)}to{transform:translateY(530px)}}
 @keyframes bar{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
 @keyframes glitch{0%,92%,96%,100%{opacity:0;transform:translateX(0)}93%{opacity:.8;transform:translateX(3px)}95%{opacity:.6;transform:translateX(-3px)}}
 @keyframes reveal{0%,24%{opacity:1}25%,100%{opacity:.2}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch{opacity:0}.scan{opacity:0}}
